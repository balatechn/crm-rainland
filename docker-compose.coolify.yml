# Coolify-ready stack for Rainland CRM backend
# Services:
#   db        - PostgreSQL 15
#   redis     - Redis 7 (cache / queues)
#   api       - Rainland NestJS API (built from ./apps/api)
#   evolution - Evolution API v2 (WhatsApp gateway)
#   n8n       - Workflow automation

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rainland_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - rainland_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  evolution:
    image: atendai/evolution-api:v2.2.3
    pull_policy: if_not_present
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: http://${SERVICE_FQDN_EVOLUTION_API}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_TTL: "604800"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR
      LOG_COLOR: "true"
      DEL_INSTANCE: "false"
    volumes:
      - rainland_evolution:/evolution/instances
    expose:
      - "8080"
    labels:
      - coolify.managed=true

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      WEB_ORIGIN: ${WEB_ORIGIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # WhatsApp — points to the evolution container on the internal Docker network
      WHATSAPP_API_URL: http://evolution:8080
      WHATSAPP_API_TOKEN: ${EVOLUTION_API_KEY}
      WHATSAPP_PHONE_ID: ${WHATSAPP_INSTANCE}
      # Microsoft Graph (mail)
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MAIL_FROM: ${MAIL_FROM}
      # TeleCMI
      TELECMI_APP_ID: ${TELECMI_APP_ID}
      TELECMI_SECRET: ${TELECMI_SECRET}
    expose:
      - "4000"
    labels:
      - coolify.managed=true

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      RAINLAND_API: http://api:4000/api
      RAINLAND_TOKEN: ${RAINLAND_SERVICE_TOKEN}
    volumes:
      - rainland_n8n:/home/node/.n8n
    expose:
      - "5678"

volumes:
  rainland_pgdata:
  rainland_redis:
  rainland_n8n:
  rainland_evolution:

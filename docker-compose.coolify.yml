# Coolify-ready stack for Rainland CRM backend
# Services:
#   db   - PostgreSQL 15
#   redis - Redis 7 (cache / queues)
#   api  - Rainland NestJS API (built from ./apps/api)
#   n8n  - Workflow automation
# NOTE: Evolution API (WhatsApp) is deployed as a separate Coolify service
#       to avoid Docker Hub image pull issues in this compose stack.

version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - rainland_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - rainland_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: "7d"
      WEB_ORIGIN: ${WEB_ORIGIN}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # WhatsApp — set WHATSAPP_API_URL to the Evolution API public URL when available
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      WHATSAPP_API_TOKEN: ${EVOLUTION_API_KEY:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_INSTANCE:-rainland}
      # Microsoft Graph (mail)
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MAIL_FROM: ${MAIL_FROM}
      # TeleCMI
      TELECMI_APP_ID: ${TELECMI_APP_ID}
      TELECMI_SECRET: ${TELECMI_SECRET}
    expose:
      - "4000"
    labels:
      - coolify.managed=true

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      RAINLAND_API: http://api:4000/api
      RAINLAND_TOKEN: ${RAINLAND_SERVICE_TOKEN}
    volumes:
      - rainland_n8n:/home/node/.n8n
    expose:
      - "5678"

volumes:
  rainland_pgdata:
  rainland_redis:
  rainland_n8n:
